<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="Imos Aikoroje — DevSecOps, SRE, Cloud Platform, AI Benchmark Engineering, Distributed Systems" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061423"/>
      <stop offset="55%" stop-color="#08203A"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>

    <pattern id="mesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#9FC0E0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow" cx="0.86" cy="0.22" r="0.6">
      <stop offset="0%" stop-color="#1D5C8F" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0A2540" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="card">
      <rect x="0" y="0" width="1600" height="400" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1600" height="400" fill="url(#field)"/>
    <rect width="1600" height="400" fill="url(#mesh)"/>
    <rect width="1600" height="400" fill="url(#glow)"/>

    <!-- distributed-systems motif: orbits and nodes -->
    <g fill="none" stroke="#7FB4E4" stroke-opacity="0.28" stroke-width="1.25">
      <circle cx="1385" cy="200" r="96"/>
      <circle cx="1385" cy="200" r="168"/>
      <circle cx="1385" cy="200" r="242"/>
    </g>
    <g stroke="#7FB4E4" stroke-opacity="0.3" stroke-width="1.25">
      <line x1="1385" y1="104" x2="1218" y2="278"/>
      <line x1="1218" y1="278" x2="1547" y2="286"/>
      <line x1="1547" y1="286" x2="1385" y2="104"/>
      <line x1="1385" y1="200" x2="1385" y2="104"/>
      <line x1="1385" y1="200" x2="1218" y2="278"/>
      <line x1="1385" y1="200" x2="1547" y2="286"/>
    </g>
    <g fill="#D9A441">
      <circle cx="1385" cy="104" r="6"/>
      <circle cx="1218" cy="278" r="6"/>
      <circle cx="1547" cy="286" r="6"/>
    </g>
    <circle cx="1385" cy="200" r="9" fill="#F2F7FC"/>

    <!-- type -->
    <text x="96" y="196"
          font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="92" font-weight="600" letter-spacing="-2.5" fill="#F2F7FC">Imos Aikoroje</text>

    <rect x="98" y="236" width="76" height="4" rx="2" fill="#D9A441"/>

    <text x="96" y="298"
          font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="27" font-weight="400" letter-spacing="0.4" fill="#93B2D0">DevSecOps &#8226; SRE &#8226; Cloud Platform &#8226; AI Benchmark Engineering &#8226; Distributed Systems</text>

    <rect x="0" y="396" width="1600" height="4" fill="#D9A441" fill-opacity="0.85"/>
  </g>
</svg>
